<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative; width:{{ wpx }}; height:{{ hpx }}; flex:none;">
  <sc-if value="{{ faceUp }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute; inset:0; background:linear-gradient(160deg,#fbf6ea,#f3ead4); border-radius:{{ rad }}; box-shadow:{{ ring }}; border:1px solid rgba(40,30,10,.10); overflow:hidden; font-family:'DM Serif Display',Georgia,serif; color:{{ color }};">
      <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:{{ centerSuit }}; opacity:.05;">{{ glyph }}</div>
      <div style="position:absolute; top:5%; left:7%; line-height:.82; text-align:center;">
        <div style="font-size:{{ corner }}; font-weight:700;">{{ rank }}</div>
        <div style="font-size:{{ cornerSuit }};">{{ glyph }}</div>
      </div>
      <div style="position:absolute; bottom:5%; right:7%; line-height:.82; text-align:center; transform:rotate(180deg);">
        <div style="font-size:{{ corner }}; font-weight:700;">{{ rank }}</div>
        <div style="font-size:{{ cornerSuit }};">{{ glyph }}</div>
      </div>
      <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;">
        <div style="font-size:{{ centerRank }}; line-height:.78;">{{ rank }}</div>
        <div style="font-size:{{ centerSuit }}; margin-top:6%;">{{ glyph }}</div>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ faceDown }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute; inset:0; border-radius:{{ rad }}; box-shadow:{{ ring }}; border:2px solid #f1e6cf; background-color:#123c2e; background-image:repeating-linear-gradient(45deg,rgba(231,185,74,.20) 0 5px,transparent 5px 11px),repeating-linear-gradient(-45deg,rgba(231,185,74,.20) 0 5px,transparent 5px 11px); overflow:hidden; display:flex; align-items:center; justify-content:center;">
      <div style="width:52%; height:52%; border-radius:50%; background:#0e3325; border:2px solid #e7b94a; box-shadow:inset 0 0 0 3px rgba(231,185,74,.25); display:flex; align-items:center; justify-content:center; color:#e7b94a; font-family:'DM Serif Display',Georgia,serif; font-size:{{ monogram }}; line-height:1;">B</div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:168},&quot;rank&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;A&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;suit&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;S&quot;,&quot;options&quot;:[&quot;S&quot;,&quot;H&quot;,&quot;D&quot;,&quot;C&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;faceDown&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;selected&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;w&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:110,&quot;min&quot;:36,&quot;max&quot;:320,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const M = {
      S:{g:'\u2660', c:'#28323a'},
      H:{g:'\u2665', c:'#d8453a'},
      D:{g:'\u2666', c:'#2f6fd0'},
      C:{g:'\u2663', c:'#1f8a5b'}
    };
    const suit = this.props.suit || 'S';
    const s = M[suit] || M.S;
    const w = Number(this.props.w) || 110;
    const h = Math.round(w * 1.4);
    const fd = !!this.props.faceDown;
    return {
      glyph: s.g,
      color: s.c,
      rank: this.props.rank != null ? String(this.props.rank) : 'A',
      faceUp: !fd,
      faceDown: fd,
      wpx: w + 'px',
      hpx: h + 'px',
      corner: (w * 0.17) + 'px',
      cornerSuit: (w * 0.15) + 'px',
      centerRank: (w * 0.5) + 'px',
      centerSuit: (w * 0.32) + 'px',
      rad: Math.max(4, w * 0.08) + 'px',
      monogram: (w * 0.26) + 'px',
      ring: this.props.selected
        ? '0 0 0 3px #e7b94a, 0 14px 26px rgba(0,0,0,.5)'
        : '0 5px 12px rgba(0,0,0,.34)'
    };
  }
}
</script>
</body>
</html>
